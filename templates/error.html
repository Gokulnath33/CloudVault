{% extends "base.html" %}

{% block title %}Error {{ code }} - CloudVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16 text-center">
    <div class="glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="w-16 h-16 rounded-3xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="alert-octagon" class="w-8 h-8"></i>
        </div>
        
        <h1 class="text-4xl font-extrabold text-white mb-2">{{ code }}</h1>
        <h2 class="text-lg font-semibold text-slate-200 mb-2">Notice</h2>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">{{ message }}</p>
        
        <div class="flex items-center justify-center gap-3">
            <a href="javascript:history.back()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white transition">
                Go Back
            </a>
            <a href="{{ url_for('index') }}" class="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white hover:bg-brand-500 transition">
                Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
