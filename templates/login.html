{% extends "base.html" %}

{% block title %}Sign In - CloudVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10 sm:my-16">
    <div class="glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
        
        <!-- Glow accent -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-500/20 rounded-full blur-2xl"></div>

        <div class="text-center mb-8 relative">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand-500/20">
                <i data-lucide="lock" class="w-6 h-6 text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Access Your File Vault</h2>
            <p class="text-xs text-slate-400 mt-1">Sign in with your approved account credentials</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4 relative">
            <div>
                <label for="identifier" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="identifier" name="identifier" value="{{ identifier|default('') }}" required autofocus
                           placeholder="Enter username or email"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i data-lucide="key" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2 text-sm transition transform hover:-translate-y-0.5">
                <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Vault
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="text-brand-400 hover:text-brand-300 font-semibold underline underline-offset-2">Register here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
